# German texts of the build from the backend of a website in the workbench (decision 0291).
# "Done", "Failed" and "Running" come from the backend.
"Workbench": "Werkbank"
"Builds this website for upload from the backend, only in the workbench": "Baut diese Website im Backend zum Hochladen, nur in der Werkbank"
"Build": "Build"
"Builds this website as a folder to upload by FTP, with its own vendor/. Only in the workbench, the website on the server has no such screen.": "Baut diese Website als Ordner zum Hochladen per FTP, mit eigenem vendor/. Nur in der Werkbank, auf dem Server gibt es diesen Bildschirm nicht."
"New build": "Neuer Build"
"Compare with the build on the server": "Vergleichen mit dem Build auf dem Server"
"Start the build": "Build starten"
"The build always runs here in the workbench. This field only says which build runs on the server now (its file BUILD), so the folder {folder} gets only what changed since. Empty for a full build, e.g. for the first upload.": "Gebaut wird immer hier in der Werkbank. Das Feld sagt nur, welcher Build gerade auf dem Server läuft (dort in der Datei BUILD), damit der Ordner {folder} nur bekommt, was sich seitdem geändert hat. Leer für einen vollen Build, z. B. zum ersten Hochladen."
"The build has started.": "Der Build läuft."
"A build is running.": "Ein Build läuft."
"Last build": "Letzter Build"
"No build from here yet": "Noch kein Build von hier"
"The builds lie in {folder}.": "Die Builds liegen in {folder}."
"Started": "Gestartet"
"What changed since {build}": "Was sich seit {build} geändert hat"
"Full build": "Voller Build"
"Upload the folder {folder}": "Ordner {folder} hochladen"
"In {folder}. Only upload, never mirror: the server keeps its database and media. Then clear the cache and update the database under Extensions on the server.": "In {folder}. Nur hochladen, nie spiegeln: Der Server behält seine Datenbank und Medien. Danach auf dem Server unter Erweiterungen den Cache leeren und die Datenbank aktualisieren."
"Changed files": "Geänderte Dateien"
"Files gone": "Entfallene Dateien"
"Listed in the folder, may be deleted on the server": "Im Ordner aufgelistet, dürfen auf dem Server gelöscht werden"
"The build failed.": "Der Build ist gescheitert."
"The output below says why.": "Die Ausgabe unten sagt, warum."
"The build is running.": "Der Build läuft."
"Composer installs the packages, that takes a minute. This page updates itself.": "Composer installiert die Pakete, das dauert etwa eine Minute. Diese Seite aktualisiert sich selbst."
"Output": "Ausgabe"
"This website does not run in the workbench.": "Diese Website läuft nicht in der Werkbank."
"A build of this website is running. Wait until it is done.": "Ein Build dieser Website läuft. Warte, bis er fertig ist."
"Noted as on the server. The next build makes its diff from it.": "Als hochgeladen vermerkt. Der nächste Build vergleicht mit diesem Stand."
"Noted. The next build makes its diff from {build}.": "Vermerkt. Der nächste Build vergleicht mit {build}."
"After the upload: the next build then makes its diff from this one. Until then every build starts from {build}, so building again loses nothing.": "Nach dem Hochladen klicken: Der nächste Build vergleicht dann mit diesem Stand. Bis dahin vergleicht jeder Build mit {build}, mehrfaches Bauen verliert also nichts."
